name: Lumeris
description: 'Lumeris is a physician-founded healthcare technology company delivering AI-powered primary
  care transformation through Tom, its Primary Care as a Service platform. Founded more than fifteen years
  ago, Lumeris helps physicians, health systems, and payers operate value-based care by reducing physician
  administrative burden, coordinating proactive patient experiences, and scaling care efficiently. The
  company serves over 1.4M lives across commercial, Medicare Advantage, multi-payer ACO, and Medicaid
  arrangements, and reports more than $90B in claims ingested. Lumeris is headquartered in the United States
  with its Tomorrow Labs innovation group in Cambridge, Massachusetts. Lumeris was surfaced as a portfolio
  company of Kleiner Perkins. No public developer portal, API documentation, or SDK surface was found during
  enrichment.'
